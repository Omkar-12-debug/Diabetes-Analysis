[project]
name = "mlops-diabetes"
version = "0.1.0"
description = "End-to-end MLOps pipeline for diabetes prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "pandas>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pytest>=8.0.0",
    "mlflow>=2.11.0",
    "dvc>=3.48.0",
    "s3fs>=2024.3.0",
    "shap>=0.51.0",
    "dice-ml>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
