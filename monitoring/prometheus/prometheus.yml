global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "render-production-api"
    metrics_path: "/metrics"
    scheme: "https"
    scrape_interval: 15s
    scrape_timeout: 10s
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["diabetes-risk-analysis-33r1.onrender.com:443"]

  - job_name: "local-api"
    metrics_path: "/metrics"
    scrape_interval: 5s
    scrape_timeout: 4s
    static_configs:
      - targets: ["api:8000"]
