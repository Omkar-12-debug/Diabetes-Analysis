services:
  db:
    image: postgres:15-alpine
    container_name: mlops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: diabetes_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diabetes_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mlops_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/diabetes_db
      MLFLOW_TRACKING_URI: http://mlflow:5000
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mlops_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mlops_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - mlops_network

  mlflow:
    image: python:3.11-slim
    container_name: mlops_mlflow
    restart: unless-stopped
    command: >
      sh -c "pip install --no-cache-dir mlflow psycopg2-binary &&
             mlflow server \
               --backend-store-uri postgresql://postgres:postgres@db:5432/diabetes_db \
               --default-artifact-root /mlflow/artifacts \
               --host 0.0.0.0 \
               --port 5000"
    ports:
      - "5000:5000"
    environment:
      MLFLOW_TRACKING_URI: http://0.0.0.0:5000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    networks:
      - mlops_network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: mlops_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_started
    networks:
      - mlops_network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: mlops_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - mlops_network

volumes:
  postgres_data:
    name: postgres_data
  mlflow_artifacts:
    name: mlflow_artifacts
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data

networks:
  mlops_network:
    name: mlops_network
    driver: bridge
