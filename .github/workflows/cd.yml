name: CD Release Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  staging-release:
    name: Staging Release & Image Artifact Generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and tag Backend Docker image
        run: |
          docker build \
            -t diabetes-api:${{ github.sha }} \
            -t diabetes-api:latest \
            -f Dockerfile .

      - name: Build and tag Frontend Docker image
        run: |
          docker build \
            -t diabetes-frontend:${{ github.sha }} \
            -t diabetes-frontend:latest \
            -f frontend/Dockerfile ./frontend

      - name: Smoke check release backend container
        run: |
          docker run -d -p 8000:8000 -e ENVIRONMENT=test --name release-test-api diabetes-api:${{ github.sha }}
          echo "Waiting for release container to be healthy..."
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:8000/health; then
              echo "Release backend container is healthy!"
              docker stop release-test-api
              exit 0
            fi
            echo "Waiting for container (attempt $i/30)..."
            sleep 2
          done
          echo "Healthcheck failed. Dumping container logs:"
          docker logs release-test-api
          docker stop release-test-api
          exit 1

      - name: Staging Release Summary
        run: |
          echo "=== CD Release Staging Completed Successfully ==="
          echo "Release Commit: ${{ github.sha }}"
          echo "Backend Image: diabetes-api:${{ github.sha }}"
          echo "Frontend Image: diabetes-frontend:${{ github.sha }}"
